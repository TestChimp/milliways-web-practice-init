name: ChimpHands
on:
  workflow_dispatch:
    inputs:
      session_id:
        required: true
        type: string
      prompt:
        required: true
        type: string
      branch:
        required: false
        type: string
jobs:
  chimphands:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install OpenCode + TestChimp CLI
        run: |
          npm install -g opencode-ai @testchimp/cli@latest || npm install -g opencode @testchimp/cli@latest
      - name: Clone TestChimp skill
        run: |
          mkdir -p .agents/skills
          git clone --depth 1 https://github.com/testchimphq/testchimp-skills.git .agents/skills/testchimp
      - name: Run ChimpHands
        id: chimphands_run
        continue-on-error: true
        env:
          TESTCHIMP_API_KEY: ${{ secrets.TESTCHIMP_API_KEY }}
          # Prefer non-secret Actions variable; fall back to secret; CLI defaults to prod if unset.
          TESTCHIMP_BACKEND_URL: ${{ vars.TESTCHIMP_BACKEND_URL || secrets.TESTCHIMP_BACKEND_URL }}
          SESSION_ID: ${{ inputs.session_id }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -o pipefail
          testchimp chimphands run 2>&1 | tee chimphands-run.log
      - name: Report workflow failure to TestChimp
        if: steps.chimphands_run.outcome == 'failure'
        env:
          TESTCHIMP_API_KEY: ${{ secrets.TESTCHIMP_API_KEY }}
          TESTCHIMP_BACKEND_URL: ${{ vars.TESTCHIMP_BACKEND_URL || secrets.TESTCHIMP_BACKEND_URL }}
          SESSION_ID: ${{ inputs.session_id }}
        run: |
          BACKEND="${TESTCHIMP_BACKEND_URL:-https://featureservice.testchimp.io}"
          BACKEND="${BACKEND%/}"
          ERR="$(tail -n 30 chimphands-run.log 2>/dev/null | head -c 3800)"
          if [ -z "$ERR" ]; then
            ERR="ChimpHands workflow failed. Check the GitHub Actions job logs for details."
          fi
          if [ -z "$TESTCHIMP_API_KEY" ]; then
            echo "TESTCHIMP_API_KEY secret is not set — cannot report failure to TestChimp."
            exit 1
          fi
          export ERR
          python3 - <<'PY'
          import json, os, urllib.request
          backend = os.environ.get("TESTCHIMP_BACKEND_URL", "https://featureservice.testchimp.io").rstrip("/")
          body = {
              "session_id": os.environ["SESSION_ID"],
              "status": "CHIMPHANDS_SESSION_STATUS_FAILED",
              "error_message": os.environ.get("ERR", "ChimpHands workflow failed."),
          }
          req = urllib.request.Request(
              f"{backend}/api/chimphands/complete_session",
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "TestChimp-Api-Key": os.environ["TESTCHIMP_API_KEY"],
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(resp.read().decode("utf-8", errors="replace"))
          except Exception as e:
              print(f"Failed to report ChimpHands failure: {e}")
          PY
      - name: Fail job if ChimpHands run failed
        if: steps.chimphands_run.outcome == 'failure'
        run: exit 1
